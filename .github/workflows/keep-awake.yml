# Keeps the hosted demo reachable for judging (until Dec 15, 2026). Render's free
# plan sleeps after 15 minutes without visitors. The server also visits itself every
# 10 minutes; this is the outside check, and GitHub emails the repo owner if it fails.
name: Keep the demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visit the demo's health check
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261215 ]; then
            echo "Judging is over; letting the demo sleep."
            exit 0
          fi
          # A sleeping free service takes up to a minute to wake, so allow for that.
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 https://doorman-ppw2.onrender.com/health
