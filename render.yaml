# Render Blueprint: one web service runs the API, the agent-facing MCP endpoint and the web app.
# Secrets are entered in the Render dashboard (sync: false), never committed.
# The public URL and the Log in with PayPal return URL come from the service's own address.
services:
  - type: web
    name: doorman
    runtime: node
    plan: free
    region: virginia # next to the Neon database (AWS us-east-1)
    buildCommand: npm ci --include=dev && npm run build
    # Compiled JavaScript, started directly: about 80 MB of memory instead of the
    # 220+ MB that npm plus TypeScript-on-the-fly take (the free plan has 512 MB).
    startCommand: node --enable-source-maps apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render's edge and its load balancer each add to X-Forwarded-For.
      - key: TRUSTED_PROXIES
        value: "2"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # The judges' sandbox buyer (published in the README's testing instructions).
      - key: DEMO_BUYER_PAYER_ID
        value: ZTAEZCCT64MPW
